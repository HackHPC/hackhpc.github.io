{% if include.icon_type == "fa-brand" %}<i class="resource-icon resource-icon--fa fa-brands fa-{{ include.icon }}" aria-hidden="true"></i>{% elsif include.icon_type == "fa-solid" %}<i class="resource-icon resource-icon--fa fa-solid fa-{{ include.icon }}" aria-hidden="true"></i>{% elsif include.icon_type == "img" %}<img class="resource-icon resource-icon--img" src="{{ include.icon }}" alt="" loading="lazy">{% endif %}
