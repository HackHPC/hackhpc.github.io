<div class="citation-modal-backdrop" id="citationModalBackdrop">
  <div class="citation-modal" role="dialog" aria-modal="true" aria-labelledby="citationModalTitle">
    <button class="citation-modal-close" id="citationModalClose" aria-label="Close">&times;</button>
    <h3 id="citationModalTitle">Cite this work</h3>
    <div class="citation-modal-source" id="citationModalSource"></div>
    <div class="citation-modal-tabs">
      <button class="citation-tab" data-format="apa">APA</button>
      <button class="citation-tab" data-format="ieee">IEEE</button>
      <button class="citation-tab" data-format="bibtex">BibTeX</button>
    </div>
    <pre class="citation-modal-text mono" id="citationModalText"></pre>
    <div class="citation-modal-actions">
      <button id="citationShareBtn" type="button">Share</button>
      <button id="citationCopyBtn" type="button">Copy to Clipboard</button>
      <button id="citationDownloadBtn" type="button">Download .bib</button>
    </div>
    <div class="citation-modal-status" id="citationModalStatus" role="status" aria-live="polite"></div>
  </div>
</div>
