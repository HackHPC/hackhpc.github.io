<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">

<title>{% if page.title %}{{ page.title }} · HackHPC{% else %}HackHPC — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="keywords" content="HPC, hackathon, codeathon, research computing, faculty development, science gateways, workforce development">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="HackHPC">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · HackHPC{% else %}HackHPC{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}/assets/img/logos/HackHPC-sq-whitebg.png">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/assets/img/logos/HackHPC-logoonly.png" type="image/png">
<link rel="stylesheet" href="/assets/css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Roboto+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous" referrerpolicy="no-referrer">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "HackHPC",
  "url": "{{ site.url }}",
  "logo": "{{ site.url }}/assets/img/logos/HackHPC-bar-whitebg.svg",
  "description": "{{ site.description }}",
  "sameAs": ["{{ site.github_org_url }}"]
}
</script>
