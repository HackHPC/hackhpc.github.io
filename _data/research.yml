  title: "Panel on Student Competitions"
  venue: "PEARC21 Student Program, ACM PEARC"
  date: "2021-07-21"
  date_display: "July 21, 2021"
  summary: >-
    A PEARC21 Student Program panel weighing whether ACM PEARC should host a co-located
    student cluster/coding competition alongside the ones already running at SC, ISC, and
    CHPC — arguing that repeat exposure across multiple competitions gives students an edge,
    and that PEARC could offer U.S. students another affordable, domestic on-ramp into
    research computing.
