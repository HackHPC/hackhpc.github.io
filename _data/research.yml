  venue: "Science Gateways Community Institute"
  date: "2021-02-01"
  date_display: "February 1, 2021"
  summary: >-
    Recaps the SC20 "HPC in the City" virtual hackathon (Nov 5–9, 2020): 63 participants
    across nine student teams, each paired with two mentors, used HPC resources including
    Google Compute Cloud and CloudyCluster to build applications addressing issues local to
    Atlanta and Georgia — from voter fraud analysis to COVID-19 response modeling — with
