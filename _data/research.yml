- category: media
  authors: "Farber, Rob"
  title: "CloudyCluster Helps Students Build Bright Futures in HPC"
  venue: "HPCwire"
  date: "2019-12-20"
  date_display: "December 20, 2019"
  summary: >-
    Profiles students who taught themselves programming while competing in the Cloud HPC
    Hackathon (Omnibond's CloudyCluster competition) at SC19 in Denver — including Josselyn
    Salvado and Pablo Enrique, whose stories illustrate how science-gateway-backed hackathons
    open a path into HPC careers for students with no computer science background.
  links:
