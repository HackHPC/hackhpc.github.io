# HackHPC research citations & media coverage.
# Source: hackhpc-citations-updated.md (Conference Proceedings and Papers +
# News, Conference, and Video Resources sections). Event-site listings from
# that document are intentionally excluded here — they're already covered,
# with fuller detail, on the Events Archive (/events/).
#
# category: paper | media | video
# date: ISO date used for sorting (best available; day defaults to 01 when
#   the source only gives a month/year, year-01-01 when only a year is given)
# date_display: the human-readable date as it appears in the source citation

- category: paper
  authors: "Powell, J., Hayden, L. B., Cannon, A., Holly, J., Dey, C., and Nolte, A."
  title: "The HackHPC Model: Fostering Workforce Development in High-Performance Computing Through Hackathons"
  venue: "Gateways 2022 Proceedings"
  date: "2022-10-18"
  date_display: "October 18–20, 2022"
  summary: >-
    Developing a workforce with applied skills in high-performance computing (HPC) has
    highlighted a gap in the experiences current academic programs provide, especially at
    the entry level. HackHPC — a collaboration between the Science Gateways Community
    Institute, Omnibond Systems, the Texas Advanced Computing Center, and the University of
    Tartu — was formed to close that gap through hackathons. This paper reports on the
    development and refinement of the "HackHPC Model," covering the methodologies,
    participants, and procedures used to plan and host hackathon events that foster
    workforce development in HPC.
  links:
    - label: "DOI"
      url: "https://doi.org/10.5281/zenodo.7089497"
    - label: "NSF PAR"
      url: "https://par.nsf.gov/servlets/purl/10450534"

- category: paper
  authors: "Holmen, J. K., Powell, J., Nolte, A., MacCarthy, E., Dey, C., Vergara Larrea, V. G., Parete-Koon, S., and Hayden, L. B."
  title: "FacultyHack Events: Faculty-Focused Hackathons for High-Performance Computing Curriculum Development"
  venue: "Proceedings of the International Conference on Game Jams, Hackathons and Game Creation Events (ICGJ '24)"
  date: "2024-01-01"
  date_display: "2024"
  summary: >-
    Broadening-participation initiatives that engage students often leave faculty support
    behind, even though hackathons have proved useful for student engagement. This paper
    discusses the design of FacultyHack, a faculty-focused hackathon for curriculum
    development, outlining the logistics and structure of two past events, what changed
    between them, and the lessons learned.
  links:
    - label: "DOI"
      url: "https://doi.org/10.1145/3697789.3697796"

- category: paper
  authors: "Falk, J., Nolte, A., Huppenkothen, D., Weinzierl, M., Gama, K., Spikol, D., Tollerud, E., Chue Hong, N., Knäpper, I., and Hayden, L. B."
  title: "The Future of Hackathon Research and Practice"
  venue: "IEEE Access, vol. 12, 2024, pp. 133406–133425"
  date: "2024-01-01"
  date_display: "2024"
  summary: >-
    Hackathons have been adapted to so many different contexts that best practices and
    research findings rarely cross between them. Drawing on an interdisciplinary workshop at
    the Lorentz Center, this paper reports six areas the authors see as central to deepening
    hackathon research and practice: designing for different purposes, socio-technical event
    design, scaling up, making hackathons equitable, studying hackathons, and setting and
    achieving hackathon goals.
  links:
    - label: "DOI"
      url: "https://doi.org/10.1109/ACCESS.2024.3455092"

- category: paper
  authors: "Powell, J., Hayden, L. Bailey, Cannon, A., et al."
  title: "Organizing Online Hackathons for Newcomers to a Scientific Community—Lessons Learned from Two Events"
  venue: "Proceedings of the 6th International Conference on Game Jams, Hackathons, and Game Creation Events"
  date: "2021-01-01"
  date_display: "2021"
  summary: >-
    Time-bounded events can give newcomers to a scientific community their first hands-on
    programming experience, but access to computing resources alone isn't enough — they also
    need guidance and support. This paper reports on a hackathon format the authors ran
    in-person for two years and then had to move online during the 2020 pandemic, covering
    two virtual events, what worked, what didn't, and recommendations for other organizers.
  links:
    - label: "DOI"
      url: "https://doi.org/10.1145/3472688.3472700"

- category: paper
  authors: "Mehringer, S., Cahill, K., Dey, C., Guilfoos, B., et al."
  title: "HPC-ED: Building a Sustainable Community Driven CyberTraining Catalog"
  venue: "Journal of Computational Science Education"
  date: "2025-01-01"
  date_display: "2025"
  summary: >-
    HPC-ED is a community-driven catalog for discovering and sharing CyberTraining resources,
    built around a flexible interface, thoughtful metadata design, and active community
    participation — letting authors share resources while retaining ownership, and letting
    organizations enrich their own local portals with shared materials. This paper describes
    the pilot phase: prototyping the catalog, establishing an initial metadata set, and
    gathering community feedback to plan the next implementation phase.
  links:
    - label: "DOI"
      url: "https://doi.org/10.22369/issn.2153-4136/16/1/2"
    - label: "NSF PAR"
      url: "https://par.nsf.gov/servlets/purl/10639461"

- category: paper
  authors: "Dey, C., and Lindsey, S."
  title: "Teaching AI Through Narrative Data: A Practical Framework for Data Science and Retrieval-Augmented Generation"
  venue: "Journal of Computational Science Education, vol. 17, no. 1, 2026"
  date: "2026-01-01"
  date_display: "2026"
  summary: >-
    AI/ML education is often split between technical model-building and data literacy, taught
    in isolation from each other. This paper presents a hands-on framework — debuting at the
    2025 Big Data School in Costa Rica — that grounds AI learning in a single, richly
    structured real-world dataset (the Austin Real-Time Traffic Incident Reports), having
    learners apply classification, clustering, regression, and forecasting before converting
    the data into narrative text for Retrieval-Augmented Generation (RAG) pipelines.
  links:
    - label: "DOI"
      url: "https://doi.org/10.22369/issn.2153-4136/17/1/7"
    - label: "PDF"
      url: "https://jocse.org/downloads/jocse-17-1-7.pdf"

- category: paper
  authors: "Hayden, L. B."
  title: "SGX3 Workforce Development Project Overview"
  venue: null
  date: "2023-01-01"
  date_display: "2023"
  summary: >-
    An overview of SGX3's workforce development activities: forming and enriching
    relationships with minority-serving institutions to bring gateway development into
    curricula, bring domain-specific gateways into classrooms and research settings, and
    train faculty to sustain those efforts beyond the life of SGX3 itself, through the SGX3
    Faculty Program's training, HPC account support, and curriculum-implementation
    consulting.
  links:
    - label: "NSF PAR"
      url: "https://par.nsf.gov/servlets/purl/10533741"

- category: paper
  authors: "Nolte, A., Pe-Than, E. P. P., Affia, A. O., et al."
  title: "How to Organize a Hackathon—A Planning Kit"
  venue: "arXiv"
  date: "2020-01-01"
  date_display: "2020"
  summary: >-
    A practical planning kit for hackathon organizers, originally developed in 2020 around 12
    key decisions for preparing, running, and following up on an in-person event. This
    updated version accounts for the shift toward online and hybrid formats since the
    pandemic, adding guidance on the affordances and requirements of in-person, online, and
    hybrid events to each of the original 12 decisions, plus updated example timelines.
  links:
    - label: "DOI"
      url: "https://doi.org/10.48550/arXiv.2008.08025"
    - label: "arXiv"
      url: "https://arxiv.org/abs/2008.08025"

- category: paper
  authors: null
  title: "HackHPC@ADMI23"
  venue: "Zenodo"
  date: "2024-01-01"
  date_display: "2024"
  summary: >-
    Archival record for the HackHPC@ADMI23 hackathon (June 26–29, 2023), a team-based event
    for undergraduates, faculty, staff, and technical specialists held as part of the ADMI
    Symposium on Computing at Minority Institutions. Built around the theme "Computing for
    Social Good," participants worked in pre-formed teams with a faculty and technical mentor
    each, after pre-hackathon training sessions on HPC and cyberinfrastructure.
